line-length = 88
target-version = "py310"

extend-exclude = [
    "tf_events",
    "notebook/dataset/MNIST",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line length handled by formatter
]

[lint.per-file-ignores]
"*.ipynb" = ["ALL"]
