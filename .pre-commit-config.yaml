repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-ast
    -   id: check-added-large-files
        args: ['--maxkb=100000']
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: debug-statements
        exclude: ^src/utils/old_multimodal_test\.py$
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

-   repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
    -   id: pyupgrade
        args: [--py39-plus]

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
    -   id: ruff
        args: [--fix]
        files: '^(scripts|src|index|convert|tokenizer)/.*\.pyi?$'
        exclude: '^(src/(config\.py|data_rl\.py|generation_trie\.py|qwen3_finetune\.py|utils\.py|utils/old_multimodal_test\.py|rl/(minionerec_trainer|reward_fns)\.py|seqrec/(case|metric|metric_constrained_ddp|metric_ddp)\.py|text_generation/(case|case_lora)\.py|token/(analyzer|tsne)\.py)|index/(build_embeddings\.py|trainer\.py|utils\.py|engine/(checkpoint|train_loop)\.py|models/layers\.py)|convert/zero_to_fp32\.py|tokenizer/(build_index_json|res_kmeans)\.py)$'
    -   id: ruff-format
        files: '^(scripts|src|index|convert|tokenizer)/.*\.pyi?$'
        exclude: '^(src/(config\.py|data_rl\.py|generation_trie\.py|qwen3_finetune\.py|utils\.py|utils/old_multimodal_test\.py|rl/(minionerec_trainer|reward_fns)\.py|seqrec/(case|metric|metric_constrained_ddp|metric_ddp)\.py|text_generation/(case|case_lora)\.py|token/(analyzer|tsne)\.py)|index/(build_embeddings\.py|trainer\.py|utils\.py|engine/(checkpoint|train_loop)\.py|models/layers\.py)|convert/zero_to_fp32\.py|tokenizer/(build_index_json|res_kmeans)\.py)$'
